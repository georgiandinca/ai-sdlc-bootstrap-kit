# CI — the enforced half of the AI-governance gate (board pillar 3/4:
# "CI/CD for the AI framework — rules as scripts").
#
# Local pre-commit hooks give fast, bypassable feedback; this workflow is the
# central, non-bypassable merge gate. Same scripts run in both places.
name: AI Governance

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  governance:
    name: Validate skills + doc frontmatter
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --quiet "pyyaml>=6"

      - name: Validate Agent Skills (agentskills.io)
        run: python3 scripts/validate-skills.py

      - name: Validate doc frontmatter contract (AGENTS.md §4.2)
        run: python3 scripts/validate-frontmatter.py
      - name: Frontmatter validator unit tests (debt baseline)
        run: python3 scripts/tests/test_validate_frontmatter.py

      # scripts/session/ may be absent (e.g. a trimmed install); skip when the manifest is not installed.
      - name: Validate session lifecycle-moments manifest
        run: |
          if [ ! -f scripts/session/moments.json ]; then echo "skipped: scripts/session/moments.json not installed"; exit 0; fi
          python3 scripts/validate-moments.py

      - name: Validate per-seat profiles manifest
        run: |
          if [ ! -f scripts/session/seat-profiles.json ]; then echo "skipped: scripts/session/seat-profiles.json not installed"; exit 0; fi
          python3 scripts/validate-seat-profiles.py

      - name: Context budget for always-loaded instructions
        run: |
          if [ ! -f scripts/context-budget.json ]; then echo "skipped: scripts/context-budget.json not installed"; exit 0; fi
          python3 scripts/check-context-budget.py

      - name: Run knowledge-graph unit tests
        run: |
          python3 scripts/knowledge/tests/test_graph_store.py
          python3 scripts/knowledge/tests/test_manifest.py
          python3 scripts/knowledge/tests/test_ingest_docs.py
          python3 scripts/knowledge/tests/test_ingest_code.py
          python3 scripts/knowledge/tests/test_link_commits.py
          python3 scripts/knowledge/tests/test_query.py
          python3 scripts/knowledge/tests/test_ingest.py
          python3 scripts/knowledge/tests/test_mcp_server.py
          python3 scripts/knowledge/tests/test_end_to_end.py
          python3 scripts/knowledge/tests/test_export_html.py
          python3 scripts/knowledge/tests/test_freshness.py
          python3 scripts/knowledge/tests/test_ingest_issues.py
          python3 scripts/knowledge/tests/test_link_issues.py
          python3 scripts/knowledge/tests/test_issue_chain.py

      - name: Run consumption/ROI unit tests (token-roi theme)
        run: |
          python3 dashboard/tests/test_schema.py
          python3 dashboard/tests/test_roi.py
          python3 scripts/spend/tests/test_parse_transcript.py
          python3 scripts/spend/tests/test_collect_usage.py
          python3 scripts/spend/tests/test_import_invoice.py
          python3 scripts/spend/tests/test_import_api_usage.py
          python3 scripts/spend/tests/test_import_tickets.py
          python3 scripts/spend/tests/test_export_sessions.py
          python3 scripts/spend/tests/test_import_sessions.py
          python3 scripts/tests/test_redact.py
          python3 scripts/tests/test_ci_triage_log_slice.py
          python3 scripts/tests/test_ci_triage_test_report.py
          python3 scripts/tests/test_planted_secrets.py
          python3 scripts/tests/test_fakeserver.py
          python3 scripts/tests/test_no_secret_leaks.py
          python3 scripts/tests/test_check_brief_churn.py
          python3 scripts/tests/test_commit_msg_ticket.py

      - name: Brief-churn gate (token-economy rule 2)
        run: python3 scripts/check-brief-churn.py --path AGENTS.md

      - name: Knowledge graph build + traceability smoke
        run: |
          python3 scripts/knowledge/ingest.py --build
          python3 scripts/knowledge/export_html.py
          python3 scripts/knowledge/ingest.py --federated --trace ADR-0001 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('nodes'), 'empty trace chain'; print('trace OK:', len(d.get('nodes')), 'nodes')"
