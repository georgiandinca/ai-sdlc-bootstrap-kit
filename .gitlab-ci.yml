# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
- governance
- test
- secret-detection
sast:
  stage: test
include:
- template: Security/SAST.gitlab-ci.yml
- template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
secret_detection:
  stage: secret-detection

# --- AI-SDLC governance gate (the kit's own pillar 4: "rules as scripts") ---
# Runs the template's validators + knowledge-ingest smoke test. The scripts
# resolve their own repo root, so they scope to template/ regardless of CWD.
# Mirror of template/.github/workflows/ai-governance.yml for this GitLab repo.
ai-governance:
  stage: governance
  image: python:3.12-slim
  before_script:
  - pip install --quiet "pyyaml>=6"
  script:
  - echo "Validating Agent Skills (agentskills.io)…"
  - python3 template/scripts/validate-skills.py
  - echo "Validating doc frontmatter contract (AGENTS.md §4.2)…"
  - python3 template/scripts/validate-frontmatter.py
  - echo "Validating session lifecycle-moments manifest…"
  - python3 template/scripts/validate-moments.py
  - echo "Running validator unit tests…"
  - python3 template/scripts/tests/test_validate_moments.py
  - echo "Validating per-seat profiles manifest…"
  - python3 template/scripts/validate-seat-profiles.py
  - echo "Running seat-profiles validator unit tests…"
  - python3 template/scripts/tests/test_validate_seat_profiles.py
  - echo "Knowledge ingest smoke test (stub builds cleanly)…"
  - python3 template/scripts/knowledge/ingest.py --build
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH'
